[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "generic-openapi-mcp"
version = "0.1.0"
description = "MCP STDIO server generated from Swagger and OpenAPI documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "mcp>=1.9,<2",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
]

[project.scripts]
openapi-mcp = "openapi_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/openapi_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
